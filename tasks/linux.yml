---
- name: Include swap configuration
  ansible.builtin.include_tasks: swap.yml

- name: Install rc.local file
  ansible.builtin.template:
    src: rc.local
    dest: /etc/rc.local
    owner: root
    group: root
    mode: "0755"
  when:
    - dronerunner_hyperthreading_disable

# This is disrupting lscpu on ubuntu 18
# - name: Disable hyperthreading
#   ansible.builtin.shell:
#     cmd: echo off > /sys/devices/system/cpu/smt/control
#   when:
#     - dronerunner_hyperthreading_disable
#   changed_when: false

# - name: Add repository
#   yum_repository:
#     name: docker
#     description: docker
#     baseurl: https://download.docker.com/linux/rhel/docker-ce.repo
#   when: ansible_distribution == "RedHat"

- name: Install required packages - prereqs
  ansible.builtin.package:
    name: "{{ dronerunner_packages_prereqs1 }}"
    state: present

# Could used variables more in the future if necessary
- name: Yum-config-manager
  ansible.builtin.command:
    cmd: yum-config-manager --add-repo https://download.docker.com/linux/rhel/docker-ce.repo
  when:
    - ansible_facts['distribution'] == "RedHat"
  changed_when: false

- name: Install required packages
  ansible.builtin.package:
    name: "{{ dronerunner_packages }}"
    state: present
    update_cache: true

- name: Make sure docker is enabled
  ansible.builtin.systemd:
    state: started
    enabled: true
    name: docker

# Root-only: startdronerunner.sh embeds DRONE_RPC_SECRET, so nothing under
# /opt/drone should be readable by other users. The developers group runs the
# scripts through sudo (see sudoers rules below), which works without read
# access because sudo executes them as root.
- name: Restrict /opt/drone to root
  ansible.builtin.file:
    path: /opt/drone
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create scripts dir
  ansible.builtin.file:
    path: /opt/drone/scripts
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install startdronerunner.sh script
  ansible.builtin.template:
    src: startdronerunner.sh
    dest: /opt/drone/scripts/startdronerunner.sh
    force: false
    owner: root
    group: root
    mode: "0700"
  notify: Start runner

# GitHub clone authentication via a host-local nginx reverse proxy.
# ----------------------------------------------------------------
# Defined only when the host opts in with dronerunner_github_token (in
# host_vars), so every other host skips the whole block and keeps anonymous
# cloning. The design: git-auth.env.j2 (below) redirects every
# "https://github.com/" clone from pipeline containers to this nginx listener,
# and nginx (gitproxy.conf.j2) forwards to github.com with a read-only token
# added upstream. The token lives only in the nginx config on the host, never
# in a container, an environment dump, or a CI log.

# The proxy listens on the docker bridge gateway so containers reach it by IP
# without DNS or /etc/hosts. That gateway is not assumed: the default-address-pools
# daemon setting (elsewhere) can move it, so it is read from the live network.
# Hosts may pin it explicitly with dronerunner_githubproxy_gateway.
- name: Inspect the docker bridge network
  ansible.builtin.command:
    cmd: docker network inspect bridge
  register: docker_bridge_inspect
  changed_when: false
  when: dronerunner_github_token is defined

- name: Set the github proxy gateway
  ansible.builtin.set_fact:
    dronerunner_githubproxy_gateway: "{{ (docker_bridge_inspect.stdout | from_json)[0].IPAM.Config[0].Gateway }}"
  when:
    - dronerunner_github_token is defined
    - dronerunner_githubproxy_gateway is not defined

- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present
  when: dronerunner_github_token is defined

- name: Make sure nginx is enabled
  ansible.builtin.systemd:
    state: started
    enabled: true
    name: nginx
  when: dronerunner_github_token is defined

- name: Install the github proxy vhost
  ansible.builtin.template:
    src: gitproxy.conf.j2
    dest: /etc/nginx/conf.d/gitproxy.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx
  when: dronerunner_github_token is defined

- name: Remove the github proxy vhost
  ansible.builtin.file:
    path: /etc/nginx/conf.d/gitproxy.conf
    state: absent
  notify: Reload nginx
  when: dronerunner_github_token is not defined

# Git auth environment file, merged into every pipeline step's environment via
# DRONE_RUNNER_ENV_FILE. Only present when the host defines dronerunner_github_token
# (in host_vars), so hosts without an intentional token are untouched.
#
# This file carries the url.*.insteadOf rewrite pointing at the proxy; it
# carries no credential. GIT_CONFIG_PARAMETERS is used rather than
# GIT_CONFIG_COUNT/KEY/VALUE because the former works on every git in the fleet
# (the latter needs git >= 2.31, and droneubuntu2004 ships 2.29).
- name: Install git auth environment file
  ansible.builtin.template:
    src: git-auth.env.j2
    dest: "{{ dronerunner_env_file }}"
    owner: root
    group: root
    mode: "0600"
  notify: Start runner
  when: dronerunner_github_token is defined

- name: Remove git auth environment file
  ansible.builtin.file:
    path: /opt/drone/scripts/git-auth.env
    state: absent
  when: dronerunner_github_token is not defined or dronerunner_env_file != '/opt/drone/scripts/git-auth.env'
  notify: Start runner


- name: Install stopdronerunner.sh script
  ansible.builtin.template:
    src: stopdronerunner.sh
    dest: /opt/drone/scripts/stopdronerunner.sh
    owner: root
    group: root
    mode: "0700"

- name: Create developers group
  ansible.builtin.group:
    name: "{{ dronerunner_developers_group }}"
    state: present

- name: Install sudo lecture shown at the password prompt
  ansible.builtin.template:
    src: sudo_lecture.j2
    dest: /etc/sudo_lecture
    owner: root
    group: root
    mode: "0444"

- name: Install sudoers rules for developers group
  ansible.builtin.template:
    src: sudoers-developers.j2
    dest: /etc/sudoers.d/drone-developers
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: Install clean.sh script
  ansible.builtin.template:
    src: clean.sh.j2
    dest: /opt/drone/scripts/clean.sh
    owner: root
    group: root
    mode: "0755"

- name: Cron job to run clean.sh
  ansible.builtin.cron:
    name: Run clean.sh
    minute: "0"
    hour: "2"
    day: 1
    job: "/opt/drone/scripts/clean.sh > /tmp/clean.txt 2>&1"

- name: Fix password expiration
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^PASS_MAX_DAYS'
    line: "PASS_MAX_DAYS 99999"

- name: Uninstall packages
  ansible.builtin.package:
    name: unattended-upgrades
    state: absent
