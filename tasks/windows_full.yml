---
# From Aug 2021. Installed docker on the base server ami.
# Aug 2022: switched to a "with Containers" ami and tasks/windows.yml, which skips docker install.
# Aug 2026: Windows Server 2025 ami is missing docker, so this full install is in use again.
#
# DockerMsftProvider (the previous install method) was retired by Microsoft in May 2023.
# Docker is now installed with Microsoft's install-docker-ce.ps1 script, which downloads
# the static Docker CE binaries from download.docker.com and registers the docker service.
# See https://learn.microsoft.com/en-us/virtualization/windowscontainers/quick-start/set-up-environment

- name: Enable Windows Container Feature
  ansible.windows.win_feature:
    name: Containers
    state: present
  register: dockerwindowsfeature

- name: Reboot server if Windows Container Feature requires it
  ansible.windows.win_reboot:
  when: dockerwindowsfeature.reboot_required

# Hyper-V enables running older container images with hyperv isolation
# (see DRONE_RUNNER_HYPERV_IMAGES). The install fails harmlessly on hosts
# without hardware virtualization (e.g. non-metal EC2 instances), so
# errors are ignored.
- name: Enable Hyper-V Feature  # noqa ignore-errors
  ansible.windows.win_feature:
    name: Hyper-V
    state: present
  register: hypervfeature
  ignore_errors: true

- name: Reboot server if Hyper-V Feature requires it
  ansible.windows.win_reboot:
  when: hypervfeature.reboot_required | default(false)

- name: Download install-docker-ce.ps1
  ansible.windows.win_get_url:
    url: https://raw.githubusercontent.com/microsoft/Windows-Containers/Main/helpful_tools/Install-DockerCE/install-docker-ce.ps1
    dest: C:\Windows\Temp\install-docker-ce.ps1

# The script installs docker.exe/dockerd.exe into C:\Windows\System32 and registers
# the docker service. -NoRestart: the Containers feature was already enabled above,
# and the script's own restart path registers a logon-triggered re-run task, which
# doesn't suit ansible.
- name: Install Docker package
  ansible.windows.win_shell: C:\Windows\Temp\install-docker-ce.ps1 -NoRestart
  args:
    creates: C:\Windows\System32\dockerd.exe
  register: dockerinstall

- name: Reboot server after fresh Docker install  # noqa no-handler
  ansible.windows.win_reboot:
  when: dockerinstall.changed

- name: Ensure docker service is started and enabled
  ansible.windows.win_service:
    name: docker
    state: started
    start_mode: auto

- name: Cron - determine number of server
  ansible.builtin.set_fact:
    drone_number_of_server: "{{ inventory_hostname_short | regex_search('(\\d+)$') }}"

- name: Create a scheduled task to reboot Weeks 1,3
  community.windows.win_scheduled_task:
    name: ScheduledReboot
    description: scheduledreboot
    actions:
      - path: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        arguments: Restart-Computer
    triggers:
      - type: monthlydow
        weeks_of_month: 1,3
        months_of_year: january,february,march,april,may,june,july,august,september,october,november,december
        days_of_week: sunday
        start_boundary: "2017-10-09T09:00:00"
    username: Administrator
    password: "{{ dronerunner_machine_password }}"
    logon_type: s4u
    state: present
    enabled: true
  when:
    - drone_number_of_server|int % 2 == 1

- name: Create a scheduled task to reboot Weeks 2,4
  community.windows.win_scheduled_task:
    name: ScheduledReboot
    description: scheduledreboot
    actions:
      - path: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        arguments: Restart-Computer
    triggers:
      - type: monthlydow
        weeks_of_month: 2,4
        months_of_year: january,february,march,april,may,june,july,august,september,october,november,december
        days_of_week: sunday
        start_boundary: "2017-10-09T09:00:00"
    username: Administrator
    password: "{{ dronerunner_machine_password }}"
    logon_type: s4u
    state: present
    enabled: true
  when:
    - drone_number_of_server|int % 2 == 0

- name: Create script directory
  ansible.windows.win_file:
    path: "{{ dronerunner_scripts_dir_win }}"
    state: directory

- name: Install startdronerunner.sh script
  ansible.windows.win_template:
    src: startdronerunner.bat
    dest: "{{ dronerunner_scripts_dir_win }}\\startdronerunner.bat"
    force: false
  notify: Start runner windows

- name: Install clean.sh script
  ansible.builtin.template:
    src: clean.sh.j2
    dest: "{{ dronerunner_scripts_dir_win }}\\clean.sh"
    owner: root
    group: root
    mode: "0755"

- name: Create a scheduled task to run clean.sh
  community.windows.win_scheduled_task:
    name: ScheduledDockerImageCleanup
    description: scheduled_docker_image_cleanup
    actions:
      - path: "C:\\Program Files\\Git\\bin\\bash.exe"
        arguments: C:\opt\drone\scripts\clean.sh
    triggers:
      - type: monthlydow
        weeks_of_month: 1
        months_of_year: january,february,march,april,may,june,july,august,september,october,november,december
        days_of_week: saturday
        start_boundary: "2017-10-09T09:00:00"
    username: Administrator
    password: "{{ dronerunner_machine_password }}"
    logon_type: s4u
    state: present
    enabled: true

# Note: images based on older windowsservercore releases (2015/2017/2019) will pull on
# Server 2025 but can only run with Hyper-V isolation, not process isolation.
# 2026-08 it's somewhat dangerous to pull images during a transition period. Commenting the
# whole thing out.
