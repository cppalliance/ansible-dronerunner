---
# Variables ##########

- name: Include OS-specific variables.
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}-family.yml"
- name: Include Distribution version specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
  failed_when: false
  when:
    - ansible_facts['distribution'] != 'MacOSX'
    - ansible_facts['os_family'] != 'Windows'

- name: Determine macos version
  ansible.builtin.set_fact:
    macos_version: "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_version'].split('.')[0] }}.{{ ansible_facts['distribution_version'].split('.')[1] }}"
  when:
    - ansible_facts['distribution'] == 'MacOSX'

- name: Include Distribution version specific variables for Mac
  ansible.builtin.include_vars: "{{ macos_version }}.yml"
  failed_when: false
  when:
    - ansible_facts['distribution'] == 'MacOSX'

# ansible_facts['distribution'] is e.g. "Microsoft Windows Server 2025 Datacenter",
# so the release year is the usable part.
- name: Determine windows version
  ansible.builtin.set_fact:
    windows_version: "Windows-{{ ansible_facts['distribution'] | regex_search('[0-9]{4}') }}"
  when:
    - ansible_facts['os_family'] == 'Windows'

- name: Include Distribution version specific variables for Windows
  ansible.builtin.include_vars: "{{ windows_version }}.yml"
  failed_when: false
  when:
    - ansible_facts['os_family'] == 'Windows'

- name: Set facts based on defaults  # noqa var-naming
  ansible.builtin.set_fact:
    "{{ item[8:] }}": "{{ lookup('vars', item) }}"
  when:
    - item is match("^default_")
    - vars[item[8:]] is not defined
  with_items: "{{ vars | list }}"

##########

- name: Include linux client
  ansible.builtin.include_tasks: linux.yml
  when: ansible_facts['system'] == 'Linux'

- name: Include mac client
  ansible.builtin.include_tasks: macos.yml
  when: ansible_facts['system'] == 'Darwin'

- name: Include windows client
  ansible.builtin.include_tasks: windows_full.yml
  when: ansible_facts['system'] == 'Win32NT'

- name: Include freebsd client
  ansible.builtin.include_tasks: freebsd.yml
  when: ansible_facts['system'] == 'FreeBSD'
