---
- name: Check if brew is installed
  ansible.builtin.shell: |
    export PATH=/usr/local/bin:/opt/homebrew/bin:$PATH
    command -v brew
  args:
    executable: /bin/bash
  register: does_brew_exist
  ignore_errors: true
  changed_when: false

# install.sh calls check_run_command_as_root and aborts with "Don't run this as
# root!", so this cannot inherit the play's become: true. It installs under
# "administrator", who needs passwordless sudo: with NONINTERACTIVE set the
# installer uses "sudo -n" and will not prompt.
- name: Install brew
  ansible.builtin.command: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install.sh)"
  environment:
    NONINTERACTIVE: "1"
  become: true
  become_user: administrator
  changed_when: true
  when: does_brew_exist.rc != 0

- name: Set hostname
  ansible.builtin.shell: |
    scutil --set HostName {{ inventory_hostname_short }}
  changed_when: false

# ansible.builtin.user does not have fullName? use shell.
- name: Create drone user
  ansible.builtin.shell: |
    set -e
    sysadminctl -addUser {{ dronerunner_user }} -fullName {{ dronerunner_user_fullname }} -shell /bin/bash -password {{ dronerunner_password }} -home /Users/{{ dronerunner_user }}
    mkdir -p /Users/{{ dronerunner_user }}
    chown {{ dronerunner_user }}:staff /Users/{{ dronerunner_user }}
  args:
    creates: /Users/{{ dronerunner_user }}

- name: Create backup admin account
  ansible.builtin.shell: |
    set -e
    set -o pipefail;
    sysadminctl -addUser cppal -fullName cppal -shell /bin/bash -password {{ dronerunner_password }} -home /Users/cppal
    mkdir -p /Users/cppal
    chown cppal:staff /Users/cppal
    dscl . -append /Groups/admin GroupMembership cppal
    user=cppal
    group=staff
    sshdir=/Users/cppal/.ssh
    pubkey1="ssh-rsa  drone-runner"
    if [ ! -f /etc/sudoers.d/$user ]; then
        sudo echo "$user ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/$user
    fi
    mkdir -p $sshdir
    echo "$pubkey1" > $sshdir/authorized_keys
    chmod -R 700 $sshdir
    chown -R $user:$group $sshdir
  args:
    creates: /Users/cppal
    executable: /bin/bash

# why is this here? There was a reason. node_exporter does write logs to this dir
- name: Change ownership of a directory  # noqa risky-file-permissions
  ansible.builtin.file:
    path: /usr/local/var/log
    state: directory
    owner: administrator
    group: admin

# Screen Sharing listens on TCP 5900 and nothing here uses it, these hosts
# being driven over SSH, so the port is closed off.
#
# Only on macOS 14 and up. Below that the hosts run Murus, a pf front end
# MacMiniVault installs, whose own ruleset in /etc/murus/ already restricts
# 5900 to known addresses. Editing /etc/pf.conf there would achieve nothing:
# Murus loads /etc/murus/pf.conf instead, and the stock file goes unread.
#
# The port is blocked rather than the service disabled, because the service is
# what console access uses, and a pass on lo0 leaves it reachable through an
# SSH tunnel.
- name: Close off the screen sharing port with pf
  when: ansible_facts['distribution_version'].split('.')[0] | int >= 14
  block:
    - name: Add the screen sharing rules to pf.conf
      ansible.builtin.blockinfile:
        path: /etc/pf.conf
        # Appends, which is where these have to go: pf wants filter rules after
        # the translation anchors that already occupy this file.
        block: |
          # Keep loopback working, so a deliberate SSH tunnel still functions.
          pass in quick on lo0 proto tcp from any to any port 5900
          # Drop everything else aimed at the Screen Sharing port.
          block drop in quick proto tcp from any to any port 5900
        marker: "# {mark} ANSIBLE MANAGED BLOCK - no screen sharing"
        owner: root
        group: wheel
        mode: "0644"
        # -n parses without loading, so a bad edit fails the task rather than
        # waiting for the next reboot to leave pf holding no rules at all.
        validate: /sbin/pfctl -n -f %s
      notify: Enable pf

    - name: Install the pf launch daemon
      ansible.builtin.copy:
        src: com.pf.plist
        dest: /Library/LaunchDaemons/com.pf.plist
        owner: root
        group: wheel
        mode: "0644"
      notify: Enable pf

# The other half of the same subject, for the hosts below 14 that the block
# above skips: those run Murus, and monitoring has to be let back in through
# it. Nothing here is keyed on the OS version, only on Murus being present,
# since that is the thing that decides it.
#
# Two conditions rather than one, because a bare /etc/murus is not enough to
# tell whether the firewall is the one set up for us: the rule is written in
# terms of a table, and a rule referring to a table that was never declared
# makes the whole ruleset fail to parse. So the table's declaration is what is
# looked for.
- name: Check for the murus tables
  ansible.builtin.stat:
    path: /etc/murus/murus.tables
  register: dronerunner_murus_tables

- name: Read the murus tables
  ansible.builtin.slurp:
    src: /etc/murus/murus.tables
  register: dronerunner_murus_tables_read
  when: dronerunner_murus_tables.stat.exists

- name: Add the monitoring rules to murus.custom
  ansible.builtin.blockinfile:
    path: /etc/murus/murus.custom
    block: "{{ dronerunner_murus_custom }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - monitoring"
    owner: root
    group: wheel
    mode: "0644"
    # No validate here, unlike the pf.conf task above. This file is a fragment
    # loaded into an anchor, and "pfctl -n -f" on it alone fails on the table,
    # which is declared in the parent ruleset. The handler's reload is what
    # reports a bad rule.
  when:
    - dronerunner_murus_tables.stat.exists
    - dronerunner_murus_tables_read.content | b64decode is search('table\s+<' ~ dronerunner_murus_table ~ '>')
  notify: Reload murus

# "softwareupdate -i -a" installs everything Apple offers here, and that
# includes the next major release, so the box upgrades itself to macOS 27.
# There is no "minor updates only" flag: --recommended does not help, because
# major releases are marked Recommended: YES the same as point releases. So
# match each offered label against the major version that is running, and drop
# the macOS ones that do not belong to it.
- name: List software updates for the running major version
  ansible.builtin.shell: |
    set -o pipefail
    major=$(sw_vers -productVersion | cut -d. -f1)
    softwareupdate --list 2>/dev/null | awk -v major="$major" '
        /Label:/ {
            sub(/^[[:space:]]*[*-][[:space:]]*Label:[[:space:]]*/, "")
            label = $0
            next
        }
        label != "" && /Title:/ {
            title = ""
            version = ""
            fields = split($0, field, ",")
            for (i = 1; i <= fields; i++) {
                if (field[i] ~ /Title:/) {
                    sub(/.*Title:[[:space:]]*/, "", field[i])
                    title = field[i]
                }
                if (field[i] ~ /Version:/) {
                    sub(/.*Version:[[:space:]]*/, "", field[i])
                    version = field[i]
                }
            }
            split(version, v, ".")
            if (title !~ /^macOS/ || v[1] == major) {
                print label
            }
            label = ""
        }' || true
  args:
    executable: /bin/bash
  register: macos_minor_updates
  changed_when: false

# Apple silicon will not install a system update without the credentials of a
# volume owner, which is why an unattended run downloads the whole thing and
# then reports "Failed to authenticate". Set dronerunner_macos_update_user and
# dronerunner_macos_update_password (from the vault) to a secure-token admin to
# install them from here. Left empty, updates that need no authorization still
# install and the rest are left to be applied by hand.
- name: Install updates
  ansible.builtin.shell: |
    set -e
    # Only macOS system updates need a volume owner, and only on Apple silicon.
    needs_owner=no
    case "$su_label" in
        "macOS "*)
            if [ "$(uname -m)" = "arm64" ]; then
                needs_owner=yes
            fi
            ;;
    esac

    if [ "$needs_owner" = "no" ]; then
        softwareupdate --install "$su_label"
    elif [ -n "$su_user" ]; then
        printf '%s\n' "$su_password" | softwareupdate --install "$su_label" --user "$su_user" --stdinpass
    else
        echo "Skipping $su_label: set dronerunner_macos_update_user and dronerunner_macos_update_password to install it unattended."
    fi
  args:
    executable: /bin/bash
    creates: /Users/{{ dronerunner_user }}/.ansible/installed_initial_mac_software_updates
  environment:
    su_user: "{{ dronerunner_macos_update_user }}"
    su_password: "{{ dronerunner_macos_update_password }}"
    su_label: "{{ item }}"
  loop: "{{ macos_minor_updates.stdout_lines | default([]) }}"
  changed_when: true
  notify: Reboot mac

- name: Create ansible state directory
  ansible.builtin.file:
    path: /Users/{{ dronerunner_user }}/.ansible
    state: directory
    owner: "{{ dronerunner_user }}"
    group: staff
    mode: "0755"

# Written only once the installs above have succeeded. The previous version of
# this task touched the marker first, so a failed update still counted as done
# and was never retried.
- name: Record that the initial software updates ran
  ansible.builtin.file:
    path: /Users/{{ dronerunner_user }}/.ansible/installed_initial_mac_software_updates
    state: touch
    owner: "{{ dronerunner_user }}"
    group: staff
    mode: "0644"
    modification_time: preserve
    access_time: preserve

- name: Check for dronerunner
  ansible.builtin.stat:
    path: /usr/local/bin/drone-runner-exec
  register: drone_exec

# Requires gnu tar
# - name: Download and unarchive dronerunner
#   ansible.builtin.unarchive:
#     src: https://github.com/drone-runners/drone-runner-exec/releases/latest/download/drone_runner_exec_darwin_amd64.tar.gz
#     dest: /usr/local/bin
#     remote_src: true

# The release assets are named the way Go names architectures, which is not the
# way the kernel does, and ansible_facts reports the kernel's. On apple silicon
# the two agree, both being arm64, so this went unnoticed while every host here
# was arm; on intel the fact reads x86_64 where the asset says amd64, and the
# download 404s.
- name: Determine the release architecture name
  ansible.builtin.set_fact:
    dronerunner_arch: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }}"

- name: Download dronerunner
  ansible.builtin.get_url:
    url: https://github.com/drone-runners/drone-runner-exec/releases/latest/download/drone_runner_exec_darwin_{{ dronerunner_arch }}.tar.gz
    dest: /tmp
    mode: '0660'
  when:
    - not drone_exec.stat.exists

- name: Extract archive  # noqa command-instead-of-module
  ansible.builtin.shell: |
    tar -xvf /tmp/drone_runner_exec_darwin_{{ dronerunner_arch }}.tar.gz
    mv drone-runner-exec /usr/local/bin/drone-runner-exec
  changed_when: true
  when:
    - not drone_exec.stat.exists

- name: Create directory for drone
  ansible.builtin.file:
    path: /Users/{{ dronerunner_user }}/.drone-runner-exec
    owner: "{{ dronerunner_user }}"
    group: staff
    mode: "0755"
    state: directory

- name: Install dronerunner config
  ansible.builtin.template:
    src: config_mac_agent
    dest: /Users/{{ dronerunner_user }}/.drone-runner-exec/config
    owner: "{{ dronerunner_user }}"
    group: staff
    mode: "0644"
    force: false

- name: Install launchctl service
  ansible.builtin.template:
    src: drone-runner-exec.plist
    dest: /Library/LaunchDaemons/drone-runner-exec.plist
    owner: root
    group: wheel
    mode: "0644"
    force: false

- name: Start drone runner
  ansible.builtin.shell: |
    launchctl load /Library/LaunchDaemons/drone-runner-exec.plist
  failed_when: false
  changed_when: true  # uncertain

# Mac OSX has a memory leak in ARD. Reboot the servers periodically:

# Once per month strategy. Deprecated.
#
# - name: cron - determine number of server
#   set_fact:
#     drone_number_of_server: "{{ inventory_hostname_short | regex_search('(\\d+)$') }}"
#
# - name: cron - determine end day
#   set_fact:
#     drone_cron_end_day: "{{ 7 * (drone_number_of_server|int % 4 + 1) }}"
#
# - name: cron - determine start day
#   set_fact:
#     drone_cron_start_day: "{{ drone_cron_end_day|int - 6 }}"
#
# - name: Create cron job to reboot server once a month
#   ansible.builtin.cron:
#     name: "reboot job"
#     minute: "0"
#     hour: "2"
#     day: "{{ drone_cron_start_day }}-{{ drone_cron_end_day }}"
#     job: "[ `date +\\%a` = 'Sun' ] && /sbin/reboot"

# Twice per month strategy:

- name: Cron - determine number of server
  ansible.builtin.set_fact:
    drone_number_of_server: "{{ inventory_hostname_short | regex_search('(\\d+)$') }}"

- name: Cron job to reboot server during first week
  ansible.builtin.cron:
    name: reboot week 1
    minute: "0"
    hour: "2"
    day: 1-7
    job: "[ `date +\\%a` = 'Sun' ] && /sbin/reboot"
  when:
    - drone_number_of_server|int % 2 == 1

- name: Cron job to reboot server during second week
  ansible.builtin.cron:
    name: reboot week 2
    minute: "0"
    hour: "2"
    day: 8-14
    job: "[ `date +\\%a` = 'Sun' ] && /sbin/reboot"
  when:
    - drone_number_of_server|int % 2 == 0

- name: Cron job to reboot server during third week
  ansible.builtin.cron:
    name: reboot week 3
    minute: "0"
    hour: "2"
    day: 15-21
    job: "[ `date +\\%a` = 'Sun' ] && /sbin/reboot"
  when:
    - drone_number_of_server|int % 2 == 1

- name: Cron job to reboot server during fourth week
  ansible.builtin.cron:
    name: reboot week 4
    minute: "0"
    hour: "2"
    day: 22-28
    job: "[ `date +\\%a` = 'Sun' ] && /sbin/reboot"
  when:
    - drone_number_of_server|int % 2 == 0
