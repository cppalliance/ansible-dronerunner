---
# Ansible adds label "test". Manually remove it on the target machine after validation.
default_dronerunner_labels: "os:freebsd15.0,test:true"

default_dronerunner_drone_runner_capacity: 2

dronerunner_packages:
  - htop
  - nload
  - bash
  - git
  - curl
  - icu
  - gcc
  - gcc15
  - gcc14
  - llvm22
  - llvm21
  - llvm20
  - llvm19
  - llvm18
  - llvm17
  - llvm16
  - llvm15
  - llvm14
  - llvm13
  - llvm12
