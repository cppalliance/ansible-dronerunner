---
- name: Start runner
  changed_when: true
  args:
    executable: /bin/bash
  ansible.builtin.shell:
    cmd: |
      docker stop runner || true
      docker rm runner || true
      /opt/drone/scripts/startdronerunner.sh

# could be modified...
- name: Start runner freebsd  # noqa command-instead-of-module
  changed_when: true
  args:
    executable: /bin/sh
  ansible.builtin.shell:
    cmd: |
      service dronerunner start

- name: Start runner windows
  ansible.windows.win_shell: |
    docker stop runner
    docker rm runner
    {{ dronerunner_scripts_dir_win }}\\startdronerunner.bat

- name: Reboot windows
  ansible.windows.win_reboot:

- name: Reboot mac
  ansible.builtin.reboot:

# Notified only, never run on its own, so an ordinary run does not turn pf back
# on. If the rules and the daemon are both already in place and pf is off, that
# is more likely somebody switching it off deliberately than a fault to repair.
#
# The daemon runs pfctl at load, so bootstrapping it is also what applies the
# rules; there is no separate pfctl here. bootout first, or launchd ignores a
# plist it considers already loaded. Both leading commands are allowed to fail:
# neither the label nor the job need exist yet, and the task's result comes
# from bootstrap.
- name: Enable pf
  ansible.builtin.shell: |
    launchctl enable system/com.pf || true
    launchctl bootout system /Library/LaunchDaemons/com.pf.plist || true
    launchctl bootstrap system /Library/LaunchDaemons/com.pf.plist
  args:
    executable: /bin/bash
  changed_when: true

# The whole Murus ruleset, not the one anchor. murus.custom reaches pf only
# through /etc/murus/pf.conf, which both declares the anchor and fills it with
# "load anchor 'murus.custom' from ...", and loading the anchor on its own
# would leave its rules unable to see the tables declared in the parent. This
# is the same reload the Murus GUI performs when rules are changed there.
- name: Reload murus  # noqa command-instead-of-module
  ansible.builtin.command: /sbin/pfctl -f /etc/murus/pf.conf
  changed_when: true

- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded

