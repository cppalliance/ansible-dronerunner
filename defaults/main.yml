---
# Customize these variables for your installation:
dronerunner_drone_rpc_proto: "https"
dronerunner_drone_rpc_host: "drone.example.com"
dronerunner_drone_rpc_secret: "mysecret"
dronerunner_drone_runner_name: "runner.example.com"
dronerunner_drone_logs_debug: "false"
dronerunner_drone_logs_trace: "false"
dronerunner_docker_image: "drone/drone-runner-docker:1"
dronerunner_drone_agent_arch: "amd64"

# Environment variables injected into every pipeline step (DRONE_RUNNER_ENVIRON),
# as comma-separated key:value pairs.
#
# B2_JOBS caps boost build parallelism. Without it, boost-ci computes jobs from
# "grep -c processor /proc/cpuinfo", which is NOT namespaced in a container, so
# every step on a 172-core host builds with -j173. Multiplied by the runner
# capacity that exhausts RAM and takes the machine down. Note cpu quota/cpuset
# do not help: boost-ci reads /proc/cpuinfo, ignoring cgroups and affinity.
# Set to "" to inject nothing.
dronerunner_environ: "B2_JOBS:8"

# Grace period in seconds used by stopdronerunner.sh (docker stop -t): how long
# to wait for running jobs to finish before force-killing the runner. Linux only;
# Windows cannot drain via stop timeout (see stopdronerunner.bat).
dronerunner_stop_timeout: 10800

# Group allowed (via /etc/sudoers.d/drone-developers) to run the start/stop
# runner scripts and apt/apt-get with sudo. Linux only.
dronerunner_developers_group: developers


# Hyper-V isolated containers (Windows). Override in group_vars,
# for example dronerunner_drone_runner_hyperv_images: "cppalliance/dronevs2015"
dronerunner_hyperv_images: ""
dronerunner_hyperv_memory: 8589934592  # bytes (8 GB)
dronerunner_hyperv_cpu_count: 2

# Set per OS in vars directory instead
# dronerunner_drone_runner_capacity:

# for macs:
dronerunner_user: drone
dronerunner_user_fullname: Drone

# set this in vault
# dronerunner_password:

# Apple silicon requires a volume owner (a secure-token admin) to authorize a
# macOS system update. Without one, softwareupdate downloads the update and
# then fails with "Failed to authenticate". Set these, the password in the
# vault, to install system updates unattended. Leave empty to skip them.
dronerunner_macos_update_user: ""
dronerunner_macos_update_password: ""
# Murus, the pf front end MacMiniVault installs on the macs below 14, keeps its
# own ruleset under /etc/murus and loads /etc/murus/pf.conf in place of the
# stock one, so the pf.conf edits made elsewhere in this role do not reach it.
#
# <Sam> is a pf table: a named list of addresses, declared in murus.tables as
# "table <Sam> { ... } persist" and referred to in rules by the angle brackets.
# Naming it here rather than in the rule below means the check for the table and
# the rule that uses it cannot disagree.
dronerunner_murus_table: Sam

# Written to /etc/murus/murus.custom, which is the file to use: the Murus GUI
# owns murus.inbound and rewrites it, and this one it leaves alone. Verbatim
# pf syntax, so overriding it means writing pf rules.
#
# The ports are what has to reach these hosts from outside: the drone runner's
# healthz/metrics on 3000, munin-node on 4949, NRPE on 5666 and node_exporter
# on 9100. The runner's own connection to the drone server is outbound and
# needs nothing here.
dronerunner_murus_custom: |
  # Monitoring: drone 3000, munin-node 4949, NRPE 5666, node_exporter 9100
  pass in proto tcp from <{{ dronerunner_murus_table }}> to any port {3000, 4949, 5666, 9100} flags S/SA keep state

# GitHub clone access for pipeline containers. Linux only; the mac, windows and
# freebsd task files ignore all of it. Opted in per host by defining
# dronerunner_github_token in host_vars; absent, the host clones anonymously as
# before and every task in the block is skipped.
#
# Two implementations, chosen with dronerunner_github_mode:
#
#   proxy   nginx forwards each clone straight to github.com with the token
#           added upstream. Fixes authentication, so the host leaves the
#           anonymous rate limit behind, but github still builds and sends a
#           full packfile for every clone.
#   mirror  nginx forwards to git-cache-proxy, which keeps a bare mirror per
#           repo, runs "git fetch --prune" before serving, and builds the
#           packfile locally. Fixes volume as well: a burst of identical clones
#           collapses into one upstream fetch, and only new objects are
#           transferred. The token moves from nginx into the mirror daemon.
#   false   neither. Nothing is installed, and a vhost, service or environment
#           file left by a previous mode is removed.
#
# Both modes listen on the same address, so git-auth.env is byte-identical
# either way: switching modes changes only this host and needs no change inside
# any container. Falling back is a one word edit here or in host_vars.
dronerunner_github_mode: proxy

# The front door for both modes, on the docker bridge gateway (detected at
# runtime, overridable with dronerunner_githubproxy_gateway).
dronerunner_githubproxy_port: 8080

# Mirror mode only. The daemon publishes on loopback and nginx fronts it, so
# this port is never reachable from a container or off the host.
dronerunner_githubmirror_port: 8081

# The daemon runs as an ordinary systemd service, not a container: one fewer
# entry in "docker ps" to mistake for a job, and it can drop privileges, which
# the published image cannot (it has no USER and runs as root).
#
# Upstream publishes no release binaries, so the role builds from source. The
# version is pinned deliberately: upstream calls itself early single-maintainer
# software and says to pin. Build and rebuild are both keyed on the installed
# binary reporting this exact version, so a normal run does nothing; bumping
# this line is what triggers a rebuild.
dronerunner_githubmirror_version: 0.1.13
dronerunner_githubmirror_repo: https://github.com/rolandjitsu/git-cache-proxy
dronerunner_githubmirror_bin: /usr/local/bin/git-cache-proxy
dronerunner_githubmirror_src_dir: /usr/local/src/git-cache-proxy

# The rust toolchain used for that build. Distro packages are not an option:
# the crate is edition 2024, which needs rustc 1.85 or newer, and no ubuntu or
# debian release ships one. So rustup, into a system-wide location rather than
# root's home, and used only at build time — the service itself needs nothing
# but the resulting binary and git.
dronerunner_githubmirror_rustup_home: /usr/local/rustup
dronerunner_githubmirror_cargo_home: /usr/local/cargo

# Debian and ubuntu names, which is the whole fleet today. A C toolchain is
# needed despite this being rust, because the TLS stack is rustls over ring and
# ring compiles its own assembly; there is no openssl in the tree, so no
# libssl-dev. Override on a non-debian host: the RedHat equivalent of
# build-essential is the "Development Tools" group or just gcc plus make.
dronerunner_githubmirror_build_packages:
  - build-essential
  - ca-certificates
  - curl
  - git

# Unprivileged service account. It owns the cache and nothing else; the binary
# stays root-owned so the daemon cannot rewrite itself. Deliberately modest:
# no login shell, but no seccomp gymnastics either.
dronerunner_githubmirror_user: gitcache

# Bare mirrors, one directory per repo, owned by the service account. Hundreds
# of boostorg repos plus the boost superproject land here, so put it on a
# filesystem with room.
dronerunner_githubmirror_cache_dir: /var/cache/git-cache-proxy
# The daemon defaults to 0, meaning unlimited and no accounting. Capped here so
# the cache cannot fill the disk; least recently used idle mirrors are evicted
# and transparently re-cloned when next asked for.
dronerunner_githubmirror_cache_max_mb: 51200
# Skip the upstream fetch when the mirror was refreshed this recently. This is
# the freshness dial: 0 revalidates against github on every single clone, and
# anything higher collapses a burst. 10 is the daemon's own default and is well
# under the gap between a push and the build that follows it.
dronerunner_githubmirror_fetch_ttl_seconds: 10

swap_configure: true   # manage the swap or not
swap_enable: true
swap_file_path: /swapfile
swap_file_size_mb: 10000
swappiness: 1

dronerunner_scripts_dir: "/opt/drone/scripts"
dronerunner_scripts_dir_win: "C:\\opt\\drone\\scripts"
# Written by the role (root:root 0600) and passed to the runner via
# DRONE_RUNNER_ENV_FILE when dronerunner_github_token is defined. Contains the
# "url.*.insteadOf" rewrite pointing at the front door; no credential, and the
# same contents in either github mode.
dronerunner_env_file: "{{ dronerunner_scripts_dir }}/git-auth.env"
# Mirror mode only, and this one does hold the credential (root:root 0600). It
# is a docker --env-file, read by the git-cache-proxy unit, which is why the
# token reaches the daemon through the environment rather than its argv.
dronerunner_githubmirror_env_file: "{{ dronerunner_scripts_dir }}/gitmirror.env"
dronerunner_packages_prereqs1: []
dronerunner_packages:
  - docker.io
  - nload
  - htop
  - locate

# Docker daemon.json, only written to /etc/docker/daemon.json when this list is
# non-empty. Each entry becomes one element of "default-address-pools". Empty
# by default: no daemon.json is created and docker uses its compiled-in
# defaults, so existing hosts are untouched until a pool is deliberately
# declared. clang4 pins the pool below (the 10.201.0.0/16 range) because 15-30
# parallel jobs need more than the default /24 bridge (254 addresses).
#
# When setting host_vars for a host, the variable will look like:
# dronerunner_docker_address_pools:
#   - { base: "10.201.0.0/16", size: 26 }
#
# See templates/daemon.json.j2 and docs/proxy.md.
dronerunner_docker_address_pools: []

dronerunner_hyperthreading_disable: true

dronerunner_cleaner_exclude_list: "aabbcc|xxyyzz"
